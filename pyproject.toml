[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudpulse"
version = "0.1.0"
description = "Real-time fraud detection pipeline: Kafka, PySpark, rules + ML scoring"
# Pinned to match Databricks serverless (Python 3.12), so code that passes here runs there.
requires-python = "==3.12.*"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import order, UP = modern syntax, B = likely bugs
select = ["E", "F", "I", "UP", "B"]
